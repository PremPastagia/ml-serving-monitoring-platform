name: CI

# Runs entirely on GitHub's free ubuntu-latest runners. Nothing here needs a GPU, a
# paid runner, a cloud account or a secret.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "42"
  # Single-threaded numerics: the runners are 2-vCPU, and thread-pool oversubscription
  # makes the test suite slower and its timings meaningless.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install linters
        run: python -m pip install --quiet ruff==0.16.7 black==26.5.1
      - name: Ruff
        run: ruff check src tests scripts
      - name: Black (check only)
        run: black --check --diff src tests scripts

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.13 is the development version.
        # Testing both is what makes `requires-python` a claim rather than a guess.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt
          python -m pip install --quiet -e . --no-deps

      # The raw files are ~6MB and are not committed. Caching them by checksum keeps
      # CI off the UCI servers on every run while still verifying the pinned digests.
      - name: Cache the raw dataset
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: adult-raw-5b00264637db-a2a9044bc167

      - name: Fetch the dataset
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: python scripts/fetch_data.py

      - name: Verify dataset checksums
        run: python scripts/fetch_data.py --verify

      - name: Data validation tests
        run: python -m pytest tests/test_validation.py tests/test_schema_contract.py -q

      - name: Unit and integration tests
        run: python -m pytest -q --durations=15 --junitxml=results/junit-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: results/junit-${{ matrix.python-version }}.xml
          if-no-files-found: warn

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt
          python -m pip install --quiet -e . --no-deps
      - name: Cache the raw dataset
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: adult-raw-5b00264637db-a2a9044bc167
      - name: Fetch the dataset
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: python scripts/fetch_data.py

      - name: Train, track and register
        run: python scripts/train.py

      - name: Smoke-test the served API
        run: python scripts/smoke_test.py

      - name: Drift experiment (reduced trials)
        run: python scripts/drift_experiment.py --trials 5 --latency-trials 3 --no-plots

      - name: Upload pipeline artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            DRIFT_RESULTS.csv
            results/
          if-no-files-found: warn

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: mlserve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size
        run: |
          docker image inspect mlserve:ci --format '{{.Size}}' \
            | awk '{printf "image size: %.1f MB\n", $1/1024/1024}'
      - name: Start the container and check it serves
        run: |
          mkdir -p artifacts/current
          docker run -d --name mlserve-ci -p 8077:8077 \
            -e MLSERVE_MODEL_SOURCE=file \
            -v "$PWD/artifacts:/app/artifacts:ro" \
            mlserve:ci
          # The container has no model bundle mounted in CI, so it must come up
          # degraded rather than crash: /health answers, /ready does not.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8077/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8077/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8077/ready)" = "503"
      - name: Container logs
        if: always()
        run: docker logs mlserve-ci || true
      - name: Stop the container
        if: always()
        run: docker rm -f mlserve-ci || true
